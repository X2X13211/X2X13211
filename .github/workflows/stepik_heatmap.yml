name: Generate Stepik Activity Matrix

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate Stepik Heatmap
        run: |
          python - << 'EOF'
          import urllib.request
          import json
          import os
          from datetime import datetime, timedelta

          STEPIK_USER_ID = "1112467990"
          url = f"https://stepik.org/api/user-activities/{STEPIK_USER_ID}"
          req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})

          try:
              with urllib.request.urlopen(req) as response:
                  data = json.loads(response.read().decode())
                  pins = data.get("user-activities", [{}])[0].get("pins", [])
          except Exception as e:
              print(f"Error fetching Stepik data: {e}")
              pins = []

          activity_map = {}
          today = datetime.utcnow().date()
          for i, count in enumerate(pins):
              day = today - timedelta(days=i)
              activity_map[day.isoformat()] = count

          box_size = 11
          gap = 3
          cols = 40
          rows = 7
          width = cols * (box_size + gap) + 40
          height = rows * (box_size + gap) + 40

          colors = {
              0: "#2A2A2A",
              1: "#4A0013",
              2: "#800020",
              3: "#B3002D",
              4: "#FF1A53"
          }

          def get_color(count):
              if count == 0: return colors[0]
              elif count <= 2: return colors[1]
              elif count <= 5: return colors[2]
              elif count <= 10: return colors[3]
              return colors[4]

          rects = []
          start_date = today - timedelta(days=(cols * 7) - 1)
          start_date -= timedelta(days=start_date.weekday())

          curr = start_date
          for c in range(cols):
              for r in range(rows):
                  date_str = curr.isoformat()
                  count = activity_map.get(date_str, 0)
                  color = get_color(count)
                  x = 20 + c * (box_size + gap)
                  y = 20 + r * (box_size + gap)
                  rects.append(f'<rect x="{x}" y="{y}" width="{box_size}" height="{box_size}" fill="{color}" rx="2"><title>{date_str}: {count} steps</title></rect>')
                  curr += timedelta(days=1)

          svg_content = f'''<svg width="{width}" height="{height}" viewBox="0 0 {width} {height}" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect width="{width}" height="{height}" rx="10" fill="#1C1C1C"/>
            <text x="20" y="14" fill="#800020" font-family="monospace" font-size="11" font-weight="bold">STEPIK ACTIVITY STREAM</text>
            {''.join(rects)}
          </svg>'''

          os.makedirs("assets", exist_ok=True)
          with open("assets/stepik_heatmap.svg", "w", encoding="utf-8") as f:
              f.write(svg_content)
          print("Heatmap generated successfully!")
          EOF

      - name: Commit and push SVG
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/stepik_heatmap.svg
          git commit -m "Update Stepik heatmap" || echo "No changes to commit"
          git push
